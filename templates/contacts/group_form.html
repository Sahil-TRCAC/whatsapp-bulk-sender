{% extends 'base.html' %}

{% block title %}{% if group %}Edit Group{% else %}Create Group{% endif %}{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">{% if group %}Edit Group{% else %}Create Group{% endif %}</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Group Name</label>
                {{ form.name }}
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                {{ form.description }}
            </div>
            <button type="submit" class="btn btn-wa">Save Group</button>
            <a href="{% url 'group_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
